[workspace]
members = ["crates/td-api", "crates/td-cache", "crates/td-cli", "xtask"]
resolver = "2"
default-members = ["crates/td-api", "crates/td-cache", "crates/td-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/osodevops/todoist-agent-cli"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
clap_mangen = "0.2"

# Terminal
colored = "3"
comfy-table = "7"
indicatif = "0.17"
dialoguer = "0.11"

# Config
toml = "0.8"
directories = "6"

# Testing
wiremock = "0.6"

# Internal crates
td-api = { path = "crates/td-api" }
td-cache = { path = "crates/td-cache" }
